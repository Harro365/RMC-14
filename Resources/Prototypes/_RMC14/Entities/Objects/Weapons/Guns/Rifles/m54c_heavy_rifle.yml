     description: A 300-round Armor-Piercing 10x24mm drum for use with the M54CE2 HAR.
               - type: RMCLoreExaminable
    content:  "Armor-Piercing drums for the M54CE2 utilize 10x24mm caseless-telescoped rounds and a monolithic-titanium-alloy 10mm bullet, optimized for close-to-mid-range engagements against moderate and heavily armored targets; however, they often over-penetrate soft targets without body armor."
