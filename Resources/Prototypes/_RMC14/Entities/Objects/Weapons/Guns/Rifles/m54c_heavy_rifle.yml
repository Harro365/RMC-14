- type: entity
  name: M54CE2 heavy assault rifle
  parent: [ CMBaseWeaponRifle, RMCBaseWeaponMagazineVisuals ]
  id: RMCWeaponRifleM54CE2
  description: A large M54C MK2 variant designed to lay down suppressing fire from a mounted position with a bipod. While somewhat unstable and less accurate, it can still be shouldered and fired with two hands. Chambered in 10x24.
   - type: RMCLoreExaminable
    content: "The United Nations Marine Corps Model 54 Carbine Extended-Capacity Mark 2, better known as the M54CE2 HAR, was developed by R&D to exploit the superior capacity of the 10x24mm caseless, telescoped round. Based upon the MK2 carbine platform, it retains the same 14.3-inch barrel and automatic ejection/cycling of misfires and duds, while incorporating a high-capacity 300-round drum magazine for heavy fire-support from a mounted position. Despite its fire-support role, it remains a short-barrel carbine for improved manoeuvrability and is rated for two-handed operation when required."
  components:
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/m54ce2/desert.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/m54ce2/desert.rsi
  - type: Tag
    tags:
    - RMCWeaponRifleM54CE2
  - type: Gun
    shotsPerBurst: 5
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      collection: CMM54CShoot
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilUnwielded: 5
    scatterWielded: 10
    scatterUnwielded: 20
    baseFireRate: 5
    burstScatterMult: 6
    modifiers:
      Burst:
        fireDelay: 0.1332
        maxScatterModifier: 10
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
      FullAuto:
        maxScatterModifier: 14
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 30
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1
    accuracyMultiplierUnwielded: 0.5
  - type: WieldableSpeedModifiers
    base: 0.5
    light: 0.69
    medium: 0.75
    heavy: 0.806
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: CMMagazineRifleM54CE2
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/hpr_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/hpr_unload.ogg
        priority: 2
        whitelist:
          tags:
          - CMMagazineRifleM54CE2
  - type: GunRequiresWield
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentBarrelCharger
          - RMCAttachmentRecoilCompensator
          - RMCAttachmentSuppressor
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentRailFlashlight
          - RMCAttachmentMagneticHarness
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
      rmc-aslot-stock:
        locked: true
        startingAttachable: RMCAttachmentM54CE2Stock
        whitelist:
          tags:
          - RMCAttachmentM54CE2Stock
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentAngledGrip
          - RMCAttachmentBipod
          - RMCAttachmentBurstFireAssembly
          - RMCAttachmentExtinguisher
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentVerticalGrip
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-barrel: 0.75, 0.03125
      rmc-aslot-rail: 0.125, 0.185
      rmc-aslot-stock: -1, 0
      rmc-aslot-underbarrel: 0.37, -0.3125
  - type: ItemCamouflage
    camouflageVariations:
      Jungle: _RMC14/Objects/Weapons/Guns/Rifles/m54ce2/jungle.rsi
      Desert: _RMC14/Objects/Weapons/Guns/Rifles/m54ce2/desert.rsi
      Snow: _RMC14/Objects/Weapons/Guns/Rifles/m54ce2/snow.rsi
      Classic: _RMC14/Objects/Weapons/Guns/Rifles/m54ce2/classic.rsi
      Urban: _RMC14/Objects/Weapons/Guns/Rifles/m54ce2/urban.rsi

- type: entity
  parent: CMMagazineRifleM54C
  id: CMMagazineRifleM54CE2
  name: "M54CE2 magazine (10x24mm)"
     description: A 300-round standard 10x24mm drum for use with the M54CE2 HAR. 
        - type: RMCLoreExaminable
    content: "Standard drums for the M54CE2 utilize 10x24 caseless-telescoped rounds and a monolithic-lead 10mm bullet, optimized for close-to-mid-range engagements against soft and lightly armored targets; however, they often under-penetrate body armor."
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - CMMagazineRifleM54CE2
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridgeRifle10x24mm
    proto: CMCartridgeRifle10x24mm
    capacity: 300
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m54ce2/desert.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: ItemCamouflage
    camouflageVariations:
      Jungle: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m54ce2/jungle.rsi
      Desert: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m54ce2/desert.rsi
      Snow: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m54ce2/snow.rsi
      Classic: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m54ce2/classic.rsi
      Urban: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m54ce2/urban.rsi
  - type: RefillableByBulletBox
    bulletType: RMCBoxBulletsRifle

- type: entity
  parent: CMMagazineRifleM54CE2
  id: CMMagazineRifleM54CE2HT
  name: "M54CE2 HT magazine (10x24mm)"
     description: A 200-round Holotargeting 10x24mm drum built for use with the M54CE2 HAR.
             - type: RMCLoreExaminable
    content: "Holotargeting drums for the M54CE2 interact with advanced internal holo-telemetry and R&D ferroelectric micro-sensors. Through this, each round communicates with the weapon’s inbuilt fire-control module. While under sustained fire, the system tracks target signatures, range shifts and hit-density, then uses this calibration to maxamize stopping power."
  components:
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridgeRifle10x24mmHT
    proto: CMCartridgeRifle10x24mmHT
    capacity: 200
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m54ce2/desert.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
    - state: ammo_band
      color: "#38CBE0"

- type: entity
  parent: CMCartridgeRifle10x24mm
  id: CMCartridgeRifle10x24mmHT
  name: cartridge (10x24mm)
  components:
  - type: Tag
    tags:
    - Cartridge
    - CMCartridgeRifle10x24mmHT
  - type: CartridgeAmmo
    proto: BulletRifle10x24mmHT

- type: entity
