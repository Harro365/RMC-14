- type: entity
  parent: WeaponRifleM4SPR
  name: M4SPR custom battle rifle
  id: WeaponRifleM4SPRCustom
  description: An improvement over the already great M4SPR. Able to take A19 rounds, as well as having better control and accuracy at the cost of being harder to use. Can take traditional M4SPR mags, at lower damage. Chambered in 10x24.
  components:
  - type: GuideHelp
    guides:
    - RMCGuideRoleSpecScout
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/m4spr_custom/desert.rsi
    layers:
    - state: bolt-open
      map: [ "enum.GunVisualLayers.Base" ]
    - sprite: _RMC14/Objects/Weapons/Guns/Attachments/barrel.rsi
      state: d_m4spr_custom_barrel
      offset: 0.65, 0
      map: [ "barrel" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    recoilWielded: 1
    recoilUnwielded: 4
    scatterWielded: 2.5
    scatterUnwielded: 8
    baseFireRate: 1.8
    burstFireRateMultiplier: 15
    modifiers:
      Burst:
        # fireDelay: 0.01
        maxScatterModifier: 10
        useBurstScatterMult: true
        unwieldedScatterMultiplier: 2
        shotsToMaxScatter: 6
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 1.1
  - type: GunDamageModifier
    multiplier: 1.1 # Lower to allow for normal M4SPR mags to have lower damage. A19 mags do more damage to compensate.
  - type: WieldableSpeedModifiers
    base: 0.725
    light: 1
    medium: 1
    heavy: 1
  - type: Gun
    shotsPerBurst: 2
    burstCooldown: 0.75
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    - Burst
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_m4spr.ogg
  - type: GunUserWhitelist
    whitelist:
      components:
      - ScoutWhitelist
  - type: Corrodible
    isCorrodible: false
  - type: Clothing
    sprite: _RMC14/Objects/Weapons/Guns/Rifles/m4spr_custom/desert.rsi
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 26 # Yes, it does this much damage in CM13. God bless parity. 
  - type: AttachableHolder
    slots:
      rmc-aslot-barrel:
        whitelist:
          tags:
          - RMCAttachmentExtendedBarrel
          - RMCAttachmentSuppressor
          - RMCM5Bayonet
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentMagneticHarness
          - RMCAttachmentRailFlashlight
          - RMCAttachmentS42xTelescopicMiniscope
          - RMCAttachmentS5RedDotSight
          - RMCAttachmentS6ReflexSight
          - RMCAttachmentS84xTelescopicScope
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - RMCAttachmentAngledGrip
          - RMCAttachmentBipod
          - RMCAttachmentFlashlightGrip
          - RMCAttachmentLaserSight
          - RMCAttachmentVerticalGrip
          - RMCAttachmentU7UnderbarrelShotgun
          - RMCAttachmentExtinguisher
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/_RMC14/Weapons/Guns/Reload/l42_reload.ogg
        ejectSound: /Audio/_RMC14/Weapons/Guns/Reload/l42_unload.ogg
        priority: 2
        startingItem: RMCMagazineRifleM4SPRA19
        whitelist:
          tags:
          - CMMagazineRifleM4SPR
          - CMMagazineRifleM4SPRAP
          - CMMagazineRifleM4SPRExt
          - RMCMagazineRifleM4SPRA19
          - RMCMagazineRifleM4SPRA19Impact
          - RMCMagazineRifleM4SPRA19Incendiary
  - type: ItemCamouflage
    camouflageVariations:
      Jungle: _RMC14/Objects/Weapons/Guns/Rifles/m4spr_custom/jungle.rsi
      Desert: _RMC14/Objects/Weapons/Guns/Rifles/m4spr_custom/desert.rsi
      Snow: _RMC14/Objects/Weapons/Guns/Rifles/m4spr_custom/snow.rsi
      Classic: _RMC14/Objects/Weapons/Guns/Rifles/m4spr_custom/classic.rsi
      Urban: _RMC14/Objects/Weapons/Guns/Rifles/m4spr_custom/urban.rsi
    layers:
      barrel:
        Jungle: m4spr_custom_barrel
        Desert: d_m4spr_custom_barrel
        Snow: s_m4spr_custom_barrel
        Classic: c_m4spr_custom_barrel
        Urban: u_m4spr_custom_barrel

- type: entity
  parent: CMMagazineRifleBase
  id: RMCMagazineRifleM4SPRA19
  name: "A19 HV magazine (10x24mm)"
  description: A 18-round 10x24mm A19 High Velocity magazine built for the Custom M4SPR. Featuring caseless telescoped rounds with a light, high-carbon steel bullet, it is a general purpose round for mid to long-range engagements with both soft and heavily armored targets alike.
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - RMCMagazineRifleM4SPRA19
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - RMCCartridgeRifleM4SPRA19
    proto: RMCCartridgeRifleM4SPRA19
    capacity: 18
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m4spra19.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]

- type: entity
  parent: RMCMagazineRifleM4SPRA19
  id: RMCMagazineRifleM4SPRA19Impact
  name: "A19 HVHI magazine (10x24mm)"
  description: A 18-round 10x24mm A19 High Velocity, High Impact magazine built for the Custom M4SPR. Featuring caseless telescoped rounds with a light, high-carbon steel bullet, it is optimized to transfer approximately 85% of its total kinetic energy into the target upon termainal contact, thereby stunning them but redusing penetration and at the cost of a superficial wound cavity; for mid to long-range engagements with both soft and lightly armored targets alike.
  - type: Tag
    tags:
    - CMMagazineRifle
    - RMCMagazineRifleM4SPRA19Impact
  - type: BallisticAmmoProvider
    proto: RMCCartridgeRifleM4SPRA19Impact
    whitelist:
      tags:
      - RMCCartridgeRifleM4SPRA19Impact
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m4spra19.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ammo_band
      color: "#00CDEA"

- type: entity
  parent: RMCMagazineRifleM4SPRA19
  id: RMCMagazineRifleM4SPRA19Incendiary
  name: "A19 HV incendiary magazine (10x24mm)"
  description: A 18-round 10x24mm A19 Incendiary magazine built for the Custom M4SPR. Featuring caseless telescoped rounds with a incendiary, high-carbon steel bullet, it is optimized to fracture on impact to catch the target ablaze at the cost of a superficial wound cavity; for mid to long-range engagements with both soft and lightly armored targets alike.
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - RMCMagazineRifleM4SPRA19Incendiary
  - type: BallisticAmmoProvider
    proto: RMCCartridgeRifleM4SPRA19Incendiary
    whitelist:
      tags:
      - RMCCartridgeRifleM4SPRA19Incendiary
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m4spra19.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ammo_band
      color: "#9C2219"

