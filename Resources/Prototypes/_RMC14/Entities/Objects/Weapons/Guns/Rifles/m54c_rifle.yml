- type: entity
  parent: CMMagazineRifleBase
  id: CMMagazineRifleM54C
  name: "M54C magazine (10x24mm)"
   description: "A 40-round standard 10x24mm magazine for use with the M54C MK2."
     - type: RMCLoreExaminable
    content: "Standard magazines for the M54C utilize 10x24 caseless-telescoped rounds and a monolithic-lead 10mm bullet, optimized for close-to-mid-range engagements against soft and lightly armored targets; however, they often under-penetrate body armor."
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - CMMagazineRifleM54C
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridgeRifle10x24mm
    proto: CMCartridgeRifle10x24mm
    capacity: 40
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m54c.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: Appearance
  - type: RefillableByBulletBox
    bulletType: RMCBoxBulletsRifle

- type: entity
  parent: CMMagazineRifleM54C
  id: CMMagazineRifleM54CAP
  name: "M54C AP magazine (10x24mm)"
     description: "A 40-round Armor-Piercing 10x24mm magazine for use with the M54C MK2."
          - type: RMCLoreExaminable
    content:  "Armor-Piercing magazines for the M54C utilize 10x24mm caseless-telescoped rounds and a monolithic-titanium-alloy 10mm bullet, optimized for close-to-mid-range engagements against moderate and heavily armored targets; however, they often over-penetrate soft targets without body armor."
  suffix: AP
  components:
  - type: Tag
    tags:
    - CMMagazineRifle
    - CMMagazineRifleM54CAP
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CMCartridgeRifle10x24mmAP
    proto: CMCartridgeRifle10x24mmAP
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m54c.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: ammo_band
      color: "#1F951F"
  - type: RefillableByBulletBox
    bulletType: RMCBoxBulletsRifleAP

