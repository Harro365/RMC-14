  id: RMCMagazineRifleM54CIncendiary
  name: "M54C Incendiary magazine (10x24mm)"
     description: "A 40-round Incendiary 10x24mm magazine for use with the M54C MK2."
    - type: RMCLoreExaminable
    content: "Incendiary magazines for the M54C utilize 10x24 caseless-telescoped rounds and a lead-core 10mm bullet and a self-igniting zirconium tip, optimized for close-to-mid-range engagements against soft and lightly armored targets and is able to ignite flammable materials, fuel, or cause extra damage internally in targets."
